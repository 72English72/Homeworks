const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const label=(w)=>w.en;
let state={tab:'learn',category:'all',idx:0,game:null,history:[]};
let ticker=null, nextTimer=null, audioBusy=0, voiceCache=[];
function voices(){try{voiceCache=speechSynthesis.getVoices()||[]}catch(_){}return voiceCache}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=voices;voices()}
function stopAudio(){audioBusy++;try{speechSynthesis.cancel()}catch(_){}}
function notice(s=''){const el=$('voice-msg');if(el)el.textContent=s}
function speak(text,lang='en',finished){
  stopAudio();const seq=audioBusy;const done=()=>{if(audioBusy===seq&&finished){finished();finished=null}};
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){notice('Bu tarayıcıda seslendirme desteği bulunamadı.');if(finished)setTimeout(done,350);return}
  const list=voices();const needed=lang==='tr'?'tr':'en';let found=null;
  if(lang==='en')found=list.find(v=>/^en[-_]GB$/i.test(v.lang))||list.find(v=>/^en(?:[-_]|$)/i.test(v.lang));
  else found=list.find(v=>/^tr(?:[-_]|$)/i.test(v.lang));
  if(lang==='tr'&&list.length>0&&!found){notice('Türkçe ses paketi yüklü değil. Türkçe metin İngilizce sesle okutulmayacak.');if(finished)setTimeout(done,350);return}
  notice(lang==='en'&&!list.some(v=>/^en[-_]GB$/i.test(v.lang))?'British English sesi yoksa cihazın İngilizce sesi kullanılır.':'');
  try{const u=new SpeechSynthesisUtterance(text);u.lang=lang==='en'?'en-GB':'tr-TR';if(found)u.voice=found;u.rate=lang==='en'?0.86:0.94;u.pitch=1.02;u.onend=done;u.onerror=done;speechSynthesis.speak(u);try{speechSynthesis.resume()}catch(_){}
    if(finished)setTimeout(done,Math.min(2200,Math.max(1100,550+text.length*65)));}
  catch(e){notice('Ses başlatılamadı. Telefonda Chrome ve konuşma ayarlarını kontrol edin.');if(finished)setTimeout(done,350)}
}
function available(){return state.category==='all'?WORDS:WORDS.filter(w=>w.group===state.category)}
function current(){const a=available();if(state.idx>=a.length)state.idx=0;return a[state.idx]}
function figure(w,cl=''){const key=w.image||'';if(key[0]==='@')return `<span class="fallback ${cl}">${safe(key.slice(1))}</span>`;return `<img alt="${safe(w.en)} görseli" draggable="false" src="${PICS[key]||''}">`}
function count(g){return g==='all'?WORDS.length:WORDS.filter(w=>w.group===g).length}
function chooseTab(tab){stopAudio();clearGame();state.tab=tab;render()}
function selectCategory(g){state.category=g;state.idx=0;render();speak(current().en)}
function pickIndex(i){state.idx=i;render();speak(current().en)}
function move(d){let n=available().length;state.idx=(state.idx+d+n)%n;render();speak(current().en)}
function renderLearn(){let w=current(),arr=available();return `<div class="panel"><div style="font-weight:900;font-size:20px">📚 Sesli Kelime Öğrenme</div><div class="hint">Resme veya kelimeye dokununca İngilizcesini duy. Türkçe için ayrı 🔊 düğmesi var. Bazı ifadeler simgelerle gösterilir.</div><div class="catrow">${GROUPS.map(([id,t])=>`<button class="cat ${state.category===id?'active':''}" data-cat="${id}">${t} (${count(id)})</button>`).join('')}</div><div class="word-wrap"><div class="picture" data-cmd="listen-en" title="İngilizcesini dinle">${figure(w)}<span class="picture-note">🔊 Dokun ve dinle</span></div><div class="wordcard"><div class="counter">${state.idx+1} / ${arr.length}</div><div class="en" data-cmd="listen-en">${safe(w.en)}</div><div class="tr">${safe(w.tr)}</div><div class="buttons"><button class="action" data-cmd="listen-en">🇬🇧 İngilizce 🔊</button><button class="action green" data-cmd="listen-tr">🇹🇷 Türkçe 🔊</button></div><div id="voice-msg" aria-live="polite"></div><div class="controls"><button class="action secondary" data-cmd="prev">← Önceki</button><button class="action" data-cmd="next">Sonraki →</button></div></div></div><div class="wordindex" aria-label="Kelime listesi">${arr.map((x,i)=>`<button class="${i===state.idx?'active':''}" data-idx="${i}">${safe(x.en)}</button>`).join('')}</div><p class="hint" style="margin-bottom:0">📖 Ödev: Kitabın 150–151. sayfalarındaki Theme 2 kelimelerini defterine yaz, seslerini dinle ve tekrar et. Ardından oyunları oyna.</p></div>`}
function renderGameMenu(){return `<div class="panel"><h2 style="margin:0 0 8px">🎮 Kelime Oyunları</h2><p class="hint">91 Theme 2 kelime ve ifadesiyle çalış. Süreli oyunlarda doğru cevap +10, yanlış cevap −5 puan.</p><div class="gamegrid">${MODES.map(([id,ic,name,desc])=>`<button class="gamecard" data-game="${id}"><span class="big">${ic}</span><span><b>${name}</b><small>${desc}</small></span></button>`).join('')}</div></div>`}
function clearGame(){clearInterval(ticker);clearTimeout(nextTimer);ticker=null;nextTimer=null;state.game=null}
function randomWord(g){const pool=(g.id==='picture'?WORDS.filter(w=>w.visual):WORDS);let a=pool.filter(w=>!state.history.includes(w.en));if(a.length<12){state.history=[];a=pool}const w=shuffle(a)[0];state.history.push(w.en);if(state.history.length>20)state.history.shift();return w}
function options(correct,n=4,imagesOnly=false){let others=shuffle(WORDS.filter(w=>w.en!==correct.en&&(!imagesOnly||w.visual)));return shuffle([correct,...others.slice(0,n-1)])}
function startGame(id){clearGame();stopAudio();let timed=['mole','speed','balloon','listen','picture','spell'].includes(id);const g={id,score:0,time:timed?(id==='speed'||id==='balloon'?45:60):null,correct:0,wrong:0,locked:false,finished:false,wrongAt:-1,selected:null,pairs:[],memory:[]};state.game=g;question(g);render();if(timed){ticker=setInterval(()=>{if(state.game!==g||g.finished)return;g.time--;const t=$('timecount');if(t){t.textContent=g.time;t.parentElement.classList.toggle('warn',g.time<=10)}if(g.time<=0)finishGame(g)},1000)}if(id==='listen')speak(g.q.en)}
function question(g){g.locked=false;g.wrongAt=-1;g.selected=null;g.feedback='';if(g.id==='match'){g.pairs=shuffle(WORDS).slice(0,5);g.left=shuffle(g.pairs);g.right=shuffle(g.pairs);g.done=[];g.leftPick=null;return}if(g.id==='memory'){g.pairs=shuffle(WORDS.filter(w=>w.visual)).slice(0,4);g.memory=shuffle(g.pairs.flatMap((w,i)=>[{w,type:'text',id:i},{w,type:'image',id:i}]));g.open=[];g.done=[];return}g.q=randomWord(g);g.opts=options(g.q,g.id==='mole'?6:4,g.id==='picture');if(g.id==='spell'){const letters=[...g.q.en];const indices=letters.map((v,i)=>/[a-z]/i.test(v)?i:null).filter(x=>x!==null);g.missing=indices[Math.floor(Math.random()*indices.length)];g.missingAnswer=g.q.en[g.missing];g.missingDisplay=letters.map((v,i)=>i===g.missing?'＿':v).join('');const alpha='abcdefghijklmnopqrstuvwxyz'.split('').filter(l=>l!==g.missingAnswer.toLowerCase());g.letterOpts=shuffle([g.missingAnswer,...shuffle(alpha).slice(0,3)])}}
function finishGame(g){if(state.game!==g)return;g.finished=true;g.locked=true;clearInterval(ticker);ticker=null;render()}
function updateScore(g,yes){g.score+=(yes?10:-5);g.correct+=yes?1:0;g.wrong+=yes?0:1;g.feedback=yes?'✅ Harika! +10 puan':'❌ Tekrar dene. −5 puan';render();const f=$('feedback');if(f)f.className='feedback '+(yes?'good':'bad')}
function choice(idx){let g=state.game;if(!g||g.locked||g.finished)return;const answer=g.id==='spell'?g.letterOpts[idx]===g.missingAnswer:g.opts[idx]===g.q;if(answer){g.locked=true;updateScore(g,true);const text=g.q.en;speak(text,'en',()=>{if(state.game===g&&!g.finished){question(g);render();if(g.id==='listen'){} }})}else{g.wrongAt=idx;updateScore(g,false)}}
function selectionList(g){if(g.id==='spell')return g.letterOpts.map((l,i)=>`<button data-choice="${i}" class="choice ${g.wrongAt===i?'wrong':''}">${safe(l.toUpperCase())}</button>`).join('');if(g.id==='picture')return g.opts.map((w,i)=>`<button data-choice="${i}" class="choice picChoice ${g.wrongAt===i?'wrong':''}">${figure(w)}</button>`).join('');let useTurkish=['speed','listen'].includes(g.id);return g.opts.map((w,i)=>`<button data-choice="${i}" class="choice ${g.wrongAt===i?'wrong':''}">${safe(useTurkish?w.tr:w.en)}</button>`).join('')}
function renderQuestion(g){let title='',prompt='';if(g.id==='mole'){title='Türkçesine göre doğru İngilizce kelimeye dokun';prompt=g.q.tr}if(g.id==='listen'){title='🔊 Duyduğun İngilizce kelimenin Türkçesini seç';prompt='<button class="action" data-cmd="game-listen">🔊 Tekrar dinle</button>'}if(g.id==='picture'){title='Doğru görsele dokun';prompt=g.q.en}if(g.id==='speed'){title='İngilizce kelimenin Türkçesi hangisi?';prompt=g.q.en}if(g.id==='balloon'){title='Türkçesine uygun balonu patlat';prompt=g.q.tr}if(g.id==='spell'){title='Eksik İngilizce harfi bul';prompt=g.missingDisplay+'<small style="display:block;color:#4d87ae;font-size:17px;margin-top:7px">'+safe(g.q.tr)+'</small>'}
 let type=g.id==='mole'?'moles':g.id==='balloon'?'balloon-grid':'choices';return `<div class="question"><div class="label">${title}</div><strong>${prompt}</strong></div><div class="${type}">${g.id==='mole'?g.opts.map((w,i)=>`<button data-choice="${i}" class="mole ${g.wrongAt===i?'wrong':''}"><span class="mole-face">🐹</span>${safe(w.en)}</button>`).join(''):g.id==='balloon'?g.opts.map((w,i)=>`<button class="balloon" data-choice="${i}">${safe(w.en)}</button>`).join(''):selectionList(g)}</div>`}
function renderMatch(g){const items=(a,side)=>a.map((w,i)=>`<button class="matchbtn ${g.done.includes(w.en)?'done':''} ${g[side+'Pick']===w.en?'sel':''}" data-match="${side}:${i}" ${g.done.includes(w.en)?'disabled':''}>${safe(side==='left'?w.en:w.tr)}</button>`).join('');return `<div class="question"><strong>İngilizce ile Türkçe eşlerini bul</strong></div><div class="matchcols"><div class="matchcol">${items(g.left,'left')}</div><div class="matchcol">${items(g.right,'right')}</div></div><p class="hint">İki sütundan eşleşen kelimelere dokun.</p>`}
function matchPick(str){let g=state.game;if(!g||g.finished)return;const [side,i]=str.split(':');const w=g[side][Number(i)];if(g.done.includes(w.en))return;g[side+'Pick']=w.en;if(g.leftPick&&g.rightPick){if(g.leftPick===g.rightPick){g.done.push(g.leftPick);updateScore(g,true);speak(g.leftPick);if(g.done.length===g.pairs.length){g.feedback='🎉 Tüm eşleştirmeler tamamlandı!';g.finished=true;clearInterval(ticker);render()}}else{updateScore(g,false)}g.leftPick=null;g.rightPick=null}render()}
function renderMemory(g){return `<div class="question"><strong>İngilizce kelimeyle aynı resmin eşini bul</strong></div><div class="memorygrid">${g.memory.map((m,i)=>{const visible=g.done.includes(m.id)||g.open.includes(i);return `<button class="mem ${visible?'open':''} ${g.done.includes(m.id)?'done':''}" data-memory="${i}">${visible?(m.type==='text'?`<span style="font-size:clamp(12px,2vw,19px)">${safe(m.w.en)}</span>`:figure(m.w)):'?'}</button>`}).join('')}</div>`}
function memoryPick(i){let g=state.game;if(!g||g.locked||g.finished||g.open.includes(i)||g.done.includes(g.memory[i].id))return;g.open.push(i);render();if(g.open.length===2){g.locked=true;let [a,b]=g.open.map(j=>g.memory[j]);if(a.id===b.id&&a.type!==b.type){g.done.push(a.id);updateScore(g,true);speak(a.w.en);g.open=[];g.locked=false;if(g.done.length===4){g.finished=true;g.feedback='🎉 Hafıza oyunu tamamlandı!'}render()}else{updateScore(g,false);nextTimer=setTimeout(()=>{if(state.game===g){g.open=[];g.locked=false;render()}},850)}}}
function renderGame(){let g=state.game;if(!g)return renderGameMenu();let name=MODES.find(x=>x[0]===g.id)[2];let content=g.finished?`<div class="question"><strong>🏁 Oyun tamamlandı!</strong><p style="font-size:23px;margin:14px 0">${g.score} puan</p><p>✅ ${g.correct} doğru &nbsp; ❌ ${g.wrong} yanlış</p></div><div class="buttons"><button class="action" data-restart="${g.id}">🔄 Tekrar oyna</button><button class="action secondary" data-cmd="game-back">🎮 Oyunları seç</button></div>`:g.id==='match'?renderMatch(g):g.id==='memory'?renderMemory(g):renderQuestion(g);return `<div class="panel"><div class="gamebar"><button class="action secondary" data-cmd="game-back">← Oyunlar</button><b>${name}</b><div class="stats"><span class="stat">⭐ ${g.score}</span>${g.time!==null?`<span class="stat ${g.time<=10?'warn':''}">⏱️ <span id="timecount">${g.time}</span> sn</span>`:''}</div></div>${content}<div id="feedback" class="feedback ${g.feedback?.includes('✅')?'good':g.feedback?.includes('❌')?'bad':''}" aria-live="polite">${safe(g.feedback||'')}</div></div>`}
function render(){const main=$('content');main.innerHTML=state.tab==='learn'?renderLearn():(state.game?renderGame():renderGameMenu());$('tab-learn').classList.toggle('active',state.tab==='learn');$('tab-games').classList.toggle('active',state.tab==='games');}
$('tab-learn').addEventListener('click',()=>chooseTab('learn'));
$('tab-games').addEventListener('click',()=>chooseTab('games'));
$('test-voice').addEventListener('click',()=>speak('Hello! Listen and repeat.','en'));
$('content').addEventListener('click',e=>{const el=e.target.closest('[data-cat],[data-idx],[data-cmd],[data-game],[data-restart],[data-choice],[data-match],[data-memory]');if(!el)return;
 if(el.dataset.cat){selectCategory(el.dataset.cat);return}if(el.dataset.idx!==undefined){pickIndex(Number(el.dataset.idx));return}
 if(el.dataset.game){startGame(el.dataset.game);return}if(el.dataset.restart){startGame(el.dataset.restart);return}
 if(el.dataset.choice!==undefined){choice(Number(el.dataset.choice));return}
 if(el.dataset.match){matchPick(el.dataset.match);return}if(el.dataset.memory!==undefined){memoryPick(Number(el.dataset.memory));return}
 switch(el.dataset.cmd){case'listen-en':speak(current().en);break;case'listen-tr':speak(current().tr,'tr');break;case'prev':move(-1);break;case'next':move(1);break;case'game-listen':if(state.game)speak(state.game.q.en);break;case'game-back':clearGame();stopAudio();render();break;}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state.game?.time!==null&&state.game?.time!==undefined){clearInterval(ticker);ticker=null}stopAudio()}else if(state.game&&state.game.time!==null&&!state.game.finished&&!ticker){const g=state.game;ticker=setInterval(()=>{if(state.game!==g||g.finished)return;g.time--;const t=$('timecount');if(t)t.textContent=g.time;if(g.time<=0)finishGame(g)},1000)}});
render();
</script></body></html>
